apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: cloud-cost-compass
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
      - name: vault
        image: hashicorp/vault:1.16
        args:
        - server
        - -dev
        - -dev-root-token-id=vault-root-token
        - -log-level=info
        ports:
        - containerPort: 8200
          name: http
        env:
        - name: VAULT_ADDR
          value: "http://0.0.0.0:8200"
        - name: VAULT_TOKEN
          value: "vault-root-token"
        securityContext:
          runAsNonRoot: false
          capabilities:
            add:
            - IPC_LOCK
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: cloud-cost-compass
spec:
  selector:
    app: vault
  ports:
  - name: http
    port: 8200
    targetPort: 8200