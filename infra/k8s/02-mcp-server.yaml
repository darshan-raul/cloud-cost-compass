apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-server-config
  namespace: cloud-cost-compass
data:
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/cccdb"
  MCP_HOST: "0.0.0.0"
  MCP_PORT: "8000"
  VAULT_ADDR: "http://vault:8200"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: cloud-cost-compass
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      serviceAccountName: mcp-server-sa
      containers:
      - name: mcp-server
        image: cloud-cost-compass/mcp-server:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: mcp-server-config
        volumeMounts:
        - name: rendered-secrets
          mountPath: /etc/secrets/tenants
          readOnly: true
      - name: vault-agent
        image: hashicorp/vault:1.16
        args:
        - agent
        - -dev-only-append-root-token
        - -template-dir=/vault/secrets
        env:
        - name: VAULT_ADDR
          value: "http://vault:8200"
        - name: VAULT_APP_ROLE_NAME
          value: ""
        volumeMounts:
        - name: rendered-secrets
          mountPath: /vault/secrets
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
      volumes:
      - name: rendered-secrets
        emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-sa
  namespace: cloud-cost-compass
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: cloud-cost-compass
spec:
  selector:
    app: mcp-server
  ports:
  - port: 8000
    targetPort: 8000