apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: cloud-cost-compass
data:
  VITE_KEYCLOAK_URL: "http://keycloak:8080"
  VITE_KEYCLOAK_REALM: "cloud-compass"
  VITE_KEYCLOAK_CLIENT_ID: "cloud-compass-app"
  VITE_API_BASE: "/api"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: cloud-cost-compass
  labels:
    app: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      serviceAccountName: app-sa
      containers:
      - name: app
        image: cloud-cost-compass/app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: cloud-cost-compass
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: cloud-cost-compass
spec:
  selector:
    app: app
  ports:
  - name: http
    port: 8080
    targetPort: 8080
