apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: cloud-cost-compass
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.7.4
        ports:
        - containerPort: 6333
          name: gRPC
        - containerPort: 6334
          name: http
        env:
        - name: QDRANT__SERVICE__GRPC_PORT
          value: "6333"
        - name: QDRANT__SERVICE__HTTP_PORT
          value: "6334"
        - name: QDRANT__STORAGE__PERSISTENT
          value: "true"
        - name: QDRANT__STORAGE__SNAPSHOT
          value: "true"
        volumeMounts:
        - name: qdrant-data
          mountPath: /qdrant/storage
      volumes:
      - name: qdrant-data
        persistentVolumeClaim:
          claimName: qdrant-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-pvc
  namespace: cloud-cost-compass
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: cloud-cost-compass
spec:
  selector:
    app: qdrant
  ports:
  - name: http
    port: 6334
    targetPort: 6334
  - name: gRPC
    port: 6333
    targetPort: 6333