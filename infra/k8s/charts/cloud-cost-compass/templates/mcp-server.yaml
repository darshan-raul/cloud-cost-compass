{{- if .Values.mcpServer.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-mcp-server-config
  namespace: {{ .Release.Namespace }}
data:
  DATABASE_URL: "postgresql://postgres:postgres@{{ .Release.Name }}-postgres:5432/cccdb"
  MCP_HOST: "0.0.0.0"
  MCP_PORT: "8000"
  VAULT_ADDR: "{{ .Values.global.vaultAddr }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mcp-server
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.mcpServer.replicaCount }}
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      serviceAccountName: {{ .Release.Name }}-mcp-server-sa
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ .name }}
        {{- end }}
      {{- end }}
      containers:
      - name: mcp-server
        image: {{ .Values.mcpServer.image.repository }}:{{ .Values.mcpServer.image.tag }}
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-mcp-server-config
        volumeMounts:
        - name: rendered-secrets
          mountPath: /etc/secrets/tenants
          readOnly: true
        {{- if .Values.mcpServer.resources }}
        resources:
          {{- toYaml .Values.mcpServer.resources | nindent 10 }}
        {{- end }}
      - name: vault-agent
        image: hashicorp/vault:1.16
        args:
        - agent
        - -dev-only-append-root-token
        - -template-dir=/vault/secrets
        env:
        - name: VAULT_ADDR
          value: "{{ .Values.global.vaultAddr }}"
        volumeMounts:
        - name: rendered-secrets
          mountPath: /vault/secrets
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
      volumes:
      - name: rendered-secrets
        emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-mcp-server-sa
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mcp-server
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: mcp-server
  ports:
  - port: 8000
    targetPort: 8000
{{- end }}