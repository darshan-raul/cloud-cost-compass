{{- if .Values.qdrant.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-qdrant
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.7.4
        ports:
        - containerPort: 6333
          name: gRPC
        - containerPort: 6334
          name: http
        env:
        - name: QDRANT__SERVICE__GRPC_PORT
          value: "6333"
        - name: QDRANT__SERVICE__HTTP_PORT
          value: "6334"
        - name: QDRANT__STORAGE__PERSISTENT
          value: "true"
        - name: QDRANT__STORAGE__SNAPSHOT
          value: "true"
        volumeMounts:
        - name: qdrant-data
          mountPath: /qdrant/storage
        {{- if .Values.qdrant.resources }}
        resources:
          {{- toYaml .Values.qdrant.resources | nindent 10 }}
        {{- end }}
      {{- if .Values.qdrant.persistence.enabled }}
      volumes:
      - name: qdrant-data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-qdrant-pvc
      {{- else }}
      volumes:
      - name: qdrant-data
        emptyDir: {}
      {{- end }}
---
{{- if .Values.qdrant.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-qdrant-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.qdrant.persistence.size }}
  {{- if .Values.qdrant.persistence.storageClass }}
  storageClassName: {{ .Values.qdrant.persistence.storageClass }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-qdrant
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: qdrant
  ports:
  - name: http
    port: 6334
    targetPort: 6334
  - name: gRPC
    port: 6333
    targetPort: 6333
{{- end }}