cluster:
  kind: kind
  region: us-east-1

namespace: cloud-cost-compass

image:
  repository: cloud-cost-compass
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

ecr:
  enabled: false

vault:
  enabled: true
  devMode: true
  service:
    type: ClusterIP
  serviceAccount:
    create: false
    name: vault

keycloak:
  enabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: false
  realmImport:
    enabled: true
    filename: ccc-realm.json
  extraEnvVars:
    - name: KEYCLOAK_ADMIN
      value: admin
    - name: KEYCLOAK_ADMIN_PASSWORD
      value: admin
    - name: KC_PROXY
      value: edge

cloudnative-pg:
  enabled: true
  operator:
    image:
      tag: latest

postgres:
  enabled: true
  cluster:
    spec:
      instances: 1
      storage:
        size: 1Gi
        storageClass: standard
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi

qdrant:
  enabled: true
  service:
    type: ClusterIP
  persistence:
    enabled: false
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

mcpServer:
  enabled: true
  replicaCount: 1
  image:
    repository: cloud-cost-compass/mcp-server
    tag: latest
  service:
    type: ClusterIP
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

streamlit:
  enabled: true
  replicaCount: 1
  image:
    repository: cloud-cost-compass/app
    tag: latest
  service:
    type: ClusterIP
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi

ragService:
  enabled: true
  replicaCount: 1
  image:
    repository: cloud-cost-compass/rag-service
    tag: latest
  service:
    type: ClusterIP
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

migrations:
  enabled: true

gateway:
  enabled: true
  ingress:
    enabled: false

global:
  ecrRegistry: ""
  vaultAddr: http://vault:8200
  keycloakUrl: http://keycloak:8080
  postgresUrl: postgres:5432