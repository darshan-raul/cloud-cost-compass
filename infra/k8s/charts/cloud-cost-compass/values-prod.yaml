cluster:
  kind: eks
  region: us-west-2

namespace: cloud-cost-compass

image:
  repository: ACCOUNT_ID.dkr.ecr.us-west-2.amazonaws.com/cloud-cost-compass
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ecr-registry-secret

ecr:
  enabled: true

vault:
  enabled: true
  devMode: true
  service:
    type: ClusterIP
  serviceAccount:
    create: false
    name: vault
  server:
    extraArgs: ""
    dev:
      enabled: true
  dataStorage:
    enabled: true
    size: 2Gi
    storageClass: gp3
  persistence:
    enabled: true
    size: 2Gi
    storageClass: gp3

keycloak:
  enabled: true
  service:
    type: LoadBalancer
  ingress:
    enabled: true
    className: nginx
    hostname: keycloak.cloud-cost-compass.example.com
    tls: true
  realmImport:
    enabled: true
    filename: ccc-realm.json
  extraEnvVars:
    - name: KEYCLOAK_ADMIN
      value: admin
    - name: KEYCLOAK_ADMIN_PASSWORD
      value: admin
    - name: KC_PROXY
      value: edge
  production: true

cloudnative-pg:
  enabled: true
  operator:
    image:
      tag: latest

postgres:
  enabled: true
  cluster:
    metadata:
      name: ccc-postgres
    spec:
      instances: 2
      primaryUpdateStrategy: unsupervised
      storage:
        size: 10Gi
        storageClass: gp3
      resources:
        limits:
          cpu: 1000m
          memory: 1Gi
        requests:
          cpu: 250m
          memory: 512Mi
      streamingReplication:
        enabled: true
      backup:
        enabled: true
        retentionPolicy: 7d

qdrant:
  enabled: true
  service:
    type: ClusterIP
  persistence:
    enabled: true
    size: 5Gi
    storageClass: gp3
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

mcpServer:
  enabled: true
  replicaCount: 2
  image:
    repository: ACCOUNT_ID.dkr.ecr.us-west-2.amazonaws.com/cloud-cost-compass/mcp-server
    tag: latest
  service:
    type: ClusterIP
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi

streamlit:
  enabled: true
  replicaCount: 2
  image:
    repository: ACCOUNT_ID.dkr.ecr.us-west-2.amazonaws.com/cloud-cost-compass/app
    tag: latest
  service:
    type: ClusterIP
  ingress:
    enabled: true
    className: nginx
    hostname: cloud-cost-compass.example.com
    tls: true
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi

ragService:
  enabled: true
  replicaCount: 2
  image:
    repository: ACCOUNT_ID.dkr.ecr.us-west-2.amazonaws.com/cloud-cost-compass/rag-service
    tag: latest
  service:
    type: ClusterIP
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

migrations:
  enabled: true

gateway:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hostname: cloud-cost-compass.example.com
    tls: true

global:
  ecrRegistry: ACCOUNT_ID.dkr.ecr.us-west-2.amazonaws.com
  vaultAddr: http://vault:8200
  keycloakUrl: http://keycloak:8080
  postgresUrl: ccc-postgres:5432